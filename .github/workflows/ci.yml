name: CI Vista Forgy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit-audit:
    name: Unit + Audit statis + Build standalone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Syntax check semua modul
        run: for f in js/*.js; do node --check "$f"; done
      - name: Unit & property test (engine/scheduler/progression/crypto)
        run: node tests/run.js
      - name: Bug recon statis (semua node × 60 seed)
        run: node tests/audit.js
      - name: Build single-file standalone
        run: |
          python3 - <<'PY'
          import re, base64
          html = open('index.html', encoding='utf-8').read()
          js = re.findall(r'<script src="(js/[^"]+)"></script>', html)
          inline = []
          for f in js:
              inline.append('<!-- %s -->\n<script>\n%s\n</script>' % (f, open(f, encoding='utf-8').read()))
          block = '\n'.join(inline) + '\n'
          out = re.sub(r'<!-- Vista Forgy[^>]*-->\n(?:\s*<script src="js/[^"]+"></script>\n?)+', lambda m: block, html)
          out = out.replace('<link rel="manifest" href="manifest.webmanifest">\n', '')
          logo = base64.b64encode(open('assets/vista-192.png', 'rb').read()).decode()
          out = out.replace('assets/vista-192.png', 'data:image/png;base64,' + logo)
          open('VistaForgy-standalone.html', 'w', encoding='utf-8').write(out)
          print('standalone:', len(out), 'chars')
          PY

  e2e:
    name: E2E + Recon + Visual + A11Y (Chromium & Firefox)
    runs-on: ubuntu-latest
    env:
      PW_PATH: ${{ github.workspace }}/tools/node_modules/playwright-core
      AXE_PATH: ${{ github.workspace }}/tools/node_modules/axe-core/axe.min.js
      VF_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build standalone
        run: |
          python3 - <<'PY'
          import re, base64
          html = open('index.html', encoding='utf-8').read()
          js = re.findall(r'<script src="(js/[^"]+)"></script>', html)
          inline = []
          for f in js:
              inline.append('<!-- %s -->\n<script>\n%s\n</script>' % (f, open(f, encoding='utf-8').read()))
          block = '\n'.join(inline) + '\n'
          out = re.sub(r'<!-- Vista Forgy[^>]*-->\n(?:\s*<script src="js/[^"]+"></script>\n?)+', lambda m: block, html)
          out = out.replace('<link rel="manifest" href="manifest.webmanifest">\n', '')
          logo = base64.b64encode(open('assets/vista-192.png', 'rb').read()).decode()
          out = out.replace('assets/vista-192.png', 'data:image/png;base64,' + logo)
          open('VistaForgy-standalone.html', 'w', encoding='utf-8').write(out)
          print('standalone built')
          PY
      - name: Pasang tools (playwright-core + axe-core) & browser + deps
        run: |
          mkdir -p tools
          npm --prefix tools install playwright-core@1.49.1 axe-core@4.10.2
          npx --prefix tools playwright-core install chromium firefox --with-deps
      - name: E2E Chromium (alur penuh + regression)
        run: node tests/e2e.js
      - name: E2E Firefox
        env: { PW_BROWSER: firefox }
        run: node tests/e2e.js
      - name: Bug recon browser (142 node + kalibrasi)
        run: node tests/audit-browser.js
      - name: Visual QA matrix (7 viewport)
        run: node tests/visual.js
      - name: Audit aksesibilitas axe-core
        run: node tests/a11y.js

  webkit-experimental:
    name: E2E WebKit (Safari engine) — eksperimental
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PW_PATH: ${{ github.workspace }}/tools/node_modules/playwright-core
      VF_ROOT: ${{ github.workspace }}
      PW_BROWSER: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Build standalone
        run: |
          python3 - <<'PY'
          import re, base64
          html = open('index.html', encoding='utf-8').read()
          js = re.findall(r'<script src="(js/[^"]+)"></script>', html)
          inline = []
          for f in js:
              inline.append('<!-- %s -->\n<script>\n%s\n</script>' % (f, open(f, encoding='utf-8').read()))
          block = '\n'.join(inline) + '\n'
          out = re.sub(r'<!-- Vista Forgy[^>]*-->\n(?:\s*<script src="js/[^"]+"></script>\n?)+', lambda m: block, html)
          out = out.replace('<link rel="manifest" href="manifest.webmanifest">\n', '')
          logo = base64.b64encode(open('assets/vista-192.png', 'rb').read()).decode()
          out = out.replace('assets/vista-192.png', 'data:image/png;base64,' + logo)
          open('VistaForgy-standalone.html', 'w', encoding='utf-8').write(out)
          PY
      - name: Pasang tools & WebKit
        run: |
          mkdir -p tools
          npm --prefix tools install playwright-core@1.49.1
          npx --prefix tools playwright-core install webkit --with-deps
      - run: node tests/e2e.js
