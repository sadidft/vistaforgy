/* token & dasar */
:root{
  --bg:#0B1220;--panel:#111C2E;--panel2:#17263D;--line:rgba(148,163,184,.18);
  --amber:#55E6C1;--spark:#F5BD67;--cyan:#7EA7FF;--ok:#55E6C1;--no:#FF8C8C;
  --tx:#E8EEF7;--mut:#94A3B8;--chart-grid:rgba(255,255,255,.07);--chart-axis:rgba(255,255,255,.24);--chart-track:rgba(255,255,255,.07);--r:12px;--r2:24px;--sp:4px;
  --font-ui:'Space Grotesk','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-body:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'JetBrains Mono','Cascadia Mono','SF Mono',Consolas,monospace;
}
[data-theme="light"]{--bg:#F2F4F8;--panel:#FFFFFF;--panel2:#F7F9FC;--line:rgba(10,20,40,.1);--tx:#171C26;--mut:#46586F;
  --amber:#0B7E63;--spark:#096B53;--cyan:#3A57D8;
  --chart-grid:rgba(11,18,32,.10);--chart-axis:rgba(11,18,32,.34);--chart-track:rgba(11,18,32,.08)}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-bottom:110px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(forced-colors:active){.ob-hero h1{-webkit-text-fill-color:CanvasText;background:none;color:CanvasText}}
body{background:var(--bg);color:var(--tx);font-family:var(--font-body);font-size:16px;line-height:1.55;
  min-height:100dvh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.045;
  background-image:linear-gradient(var(--tx) 1px,transparent 1px),linear-gradient(90deg,var(--tx) 1px,transparent 1px);
  background-size:44px 44px}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 18px calc(96px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--font-ui);letter-spacing:-.02em}
h1{font-size:1.7rem;margin-bottom:6px}h2{font-size:1.15rem}h3{font-size:1rem}
.panel h2.ph{font-size:1rem;letter-spacing:0}
b{color:var(--tx)}
.muted{color:var(--mut)}.small{font-size:.82rem}.narrow{max-width:640px}
@media(min-width:1024px){.screen.narrow{margin:0 auto}}
.mut::after{}
/* nav bawah (mobile) + sisi (desktop) */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;
  background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mut);
  font-family:var(--font-ui);font-size:.75rem;letter-spacing:.02em;padding:6px 12px;border-radius:12px;cursor:pointer;
  min-width:64px;min-height:48px;transition:color .2s,background .2s}
.nav-btn.active{color:var(--amber);background:rgba(85,230,193,.1)}
.nav-btn:active{transform:scale(.94)}
@media(max-width:360px){.nav-btn{min-width:0;flex:1;padding:6px 4px;letter-spacing:0}}
@media(min-width:1024px){
  nav.bottom{top:0;bottom:0;left:0;right:auto;width:96px;flex-direction:column;justify-content:flex-start;gap:6px;
    border-top:0;border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top)) 8px}
  .nav-btn{font-size:.66rem;min-height:64px}
  #app{padding-left:calc(96px + 26px);padding-bottom:40px}
}
/* panel & bento */
.bento{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.bento{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.bento{grid-template-columns:repeat(12,1fr)}.p-main{grid-column:span 7}.p-streak,.p-sharp{grid-column:span 5}.p-gate,.p-heat,.p-factory{grid-column:span 6}
 .panel:is(.p-main){grid-row:span 1}}
.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r2);
  padding:16px 18px;position:relative;animation:rise .5s cubic-bezier(.2,.9,.3,1) backwards}
.panel::before{content:"";position:absolute;top:0;left:14px;right:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(85,230,193,.5),transparent)}
.p-head{display:flex;align-items:center;gap:8px;color:var(--mut);font-family:var(--font-ui);font-size:.78rem;
  text-transform:uppercase;letter-spacing:.09em;margin-bottom:10px}
.p-head .ic{color:var(--amber)}
.p-big{font-family:var(--font-ui);font-size:1.05rem;margin:4px 0}
.p-sub{color:var(--mut);font-size:.86rem;margin-bottom:12px}
.stat-big{font-family:var(--font-ui);font-size:2.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.kv:last-child{border:0}
.shield-row{display:flex;align-items:center;gap:6px;color:var(--cyan);font-size:.84rem;margin-top:10px}
/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--panel2);
  color:var(--tx);font-family:var(--font-ui);font-weight:600;font-size:.92rem;border-radius:var(--r);padding:11px 18px;
  cursor:pointer;transition:transform .15s cubic-bezier(.2,.9,.3,1.4),box-shadow .2s,background .2s;min-height:44px}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--amber),#78F2D4);border:0;color:#06231B;
  box-shadow:0 6px 22px -8px rgba(85,230,193,.55)}
.btn.primary:hover{box-shadow:0 10px 28px -8px rgba(85,230,193,.75);transform:translateY(-1px)}
.btn.ghost{background:transparent}
.btn.amber{background:rgba(85,230,193,.14);border-color:rgba(85,230,193,.4);color:var(--amber)}
.btn.danger{background:rgba(255,140,140,.12);border-color:rgba(255,140,140,.4);color:var(--no)}
.btn.big{width:100%;font-size:1.05rem;padding:15px 22px}
.btn.small{padding:9px 14px;font-size:.82rem;min-height:44px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn-row.center{justify-content:center}
.filelike{position:relative;overflow:hidden;cursor:pointer}
/* beranda */
.home-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.greet h1{font-size:1.45rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.koa-home{position:relative;flex-shrink:0}
.koa3d{cursor:grab;touch-action:none}
.koa3d:active{cursor:grabbing}
.koa-bubble{position:absolute;top:6px;right:calc(100% + 8px);width:150px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:8px 10px;font-size:.74rem;color:var(--tx);opacity:0;transform:translateY(4px);transition:.35s;pointer-events:none}
.koa-bubble:not(:empty){opacity:1;transform:none}
.sharp-ring{position:relative;display:inline-block}
.sharp-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-ui);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
.pulse-soft{animation:pulseamber 2.4s ease-in-out infinite}
/* heatmap */
.heatmap{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);grid-auto-columns:1fr;gap:3px;padding-bottom:4px}
.hm-cell{width:100%;aspect-ratio:1;height:auto}
.hm-cell{border-radius:3px;background:var(--chart-track)}
.hm-cell.lvl1{background:color-mix(in srgb,var(--amber) 32%,transparent)}
.hm-cell.lvl2{background:color-mix(in srgb,var(--amber) 58%,transparent)}
.hm-cell.lvl3{background:color-mix(in srgb,var(--amber) 80%,transparent)}
.hm-cell.lvl4{background:var(--amber)}
/* form */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;font-family:var(--font-ui);font-size:.85rem;color:var(--mut)}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);
  padding:12px 14px;font-size:16px;font-family:var(--font-body);min-height:46px}
.field input:focus,.field select:focus{outline:2px solid rgba(85,230,193,.5);border-color:var(--amber)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.toggle-row:last-child{border:0}
.toggle{width:52px;height:30px;border-radius:20px;background:var(--bg);border:1px solid var(--line);position:relative;cursor:pointer;transition:.25s}
.toggle::after{content:"";position:absolute;inset:-8px -10px}/* perluas hit-area ke 44px */
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:.25s}
.toggle.on{background:rgba(85,230,193,.25);border-color:var(--ok)}
.toggle.on::after{left:25px;background:var(--ok)}
input[type=range]{accent-color:var(--amber);width:160px}
.danger-zone{border-color:rgba(255,140,140,.35)}
/* peta */
.tier-sec{margin:22px 0;padding:16px;border:1px solid var(--line);border-radius:var(--r2);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent)}
.tier-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.tier-head>div:nth-child(2){min-width:0;flex:1}
.tier-badge{font-family:var(--font-ui);font-weight:700;width:44px;height:44px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;background:linear-gradient(135deg,var(--amber),#78F2D4);color:#06231B;font-size:1.2rem;flex-shrink:0}
.tier-meta{margin-left:auto;text-align:right;font-size:.8rem;color:var(--mut);display:flex;align-items:center;gap:5px;white-space:nowrap;flex-shrink:0}
@media(max-width:520px){.tier-meta{flex-basis:100%;margin-left:0;text-align:left;white-space:normal}}
.node-grid{display:grid;gap:14px;margin-top:14px}
@media(min-width:760px){.node-grid{grid-template-columns:1fr 1fr}}
.dom-group{display:flex;flex-direction:column;gap:7px}
.dom-name{font-family:var(--font-ui);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.node-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;min-height:44px;color:var(--tx);cursor:pointer;text-align:left;transition:.2s;font-size:.9rem}
.node-chip:hover{border-color:rgba(85,230,193,.5);transform:translateX(3px)}
.node-chip .nn{font-weight:600}
.node-chip .ns{margin-left:auto;font-size:.78rem;color:var(--mut);white-space:nowrap}
.node-chip.nodelock{opacity:.45}
.node-chip.st-lancar{border-color:rgba(126,167,255,.35)}
.node-chip.st-mastered{border-color:rgba(85,230,193,.4);background:rgba(85,230,193,.06)}
.node-chip.st-memudar{border-color:rgba(85,230,193,.5)}
.gate-info{margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--mut)}
.gate-info .ok{color:var(--ok)}
.tier-sec.locked{opacity:.8}
.tier-sec.uni .tier-badge{background:linear-gradient(135deg,var(--cyan),#4F6FBF)}
/* modal node & konsep */
.modal-ov{position:fixed;inset:0;background:rgba(5,8,12,.72);backdrop-filter:blur(6px);z-index:100;display:flex;
  align-items:flex-end;justify-content:center;opacity:0;transition:.25s}
@media(min-width:760px){.modal-ov{align-items:center}}
.modal-ov.show{opacity:1}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%;max-width:560px;
  max-height:88dvh;overflow-y:auto;padding:22px;padding-bottom:calc(22px + env(safe-area-inset-bottom));transform:translateY(24px);transition:.3s cubic-bezier(.2,.9,.3,1)}
@media(min-width:760px){.modal{border-radius:22px}}
.modal-ov.show .modal{transform:none}
.nm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.status-pill{font-size:.72rem;padding:4px 10px;border-radius:20px;border:1px solid var(--line)}
.status-pill.st-mastered{color:var(--ok);border-color:var(--ok)}
.status-pill.st-lancar{color:var(--cyan);border-color:var(--cyan)}
.status-pill.st-memudar{color:var(--amber);border-color:var(--amber)}
.status-pill.st-belajar{color:var(--mut);border-color:var(--mut)}
.nm-stats{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--mut);margin:10px 0}
.nm-stats b{color:var(--tx)}
.dots{display:flex;gap:5px;margin-top:5px}
.dot{width:12px;height:12px;border-radius:4px}
.dot.ok{background:var(--ok)}.dot.no{background:var(--no);opacity:.7}
.formula{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:14px;margin:12px 0;
  font-size:1.15rem;overflow-x:auto;text-align:center}
.miss{display:flex;gap:8px;background:rgba(255,140,140,.08);border-radius:10px;padding:10px;font-size:.86rem;margin:10px 0}
.why{display:flex;gap:8px;background:rgba(126,167,255,.07);border-radius:10px;padding:10px;font-size:.86rem}
/* runner */
.run-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.phase-chip{font-family:var(--font-ui);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--amber);
  border:1px solid rgba(85,230,193,.4);border-radius:20px;padding:4px 10px;white-space:nowrap}
.run-prog{flex:1;height:8px;border-radius:6px;background:var(--chart-track);overflow:hidden}
.run-prog-fill{height:100%;background:linear-gradient(90deg,var(--amber),#78F2D4);border-radius:6px;transition:width .4s cubic-bezier(.2,.9,.3,1)}
.run-count{font-family:var(--font-mono);font-size:.8rem;color:var(--mut);white-space:nowrap}
.run-timer{position:relative;width:40px;height:40px;color:var(--amber)}
.run-timer b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.6rem;color:var(--tx)}
.run-timer b.urgent{color:var(--no)}
.combo{font-family:var(--font-ui);color:var(--spark);font-weight:700;text-align:right;margin-bottom:6px;animation:pop .3s}
.qcard{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:var(--r2);padding:18px;animation:qin .35s cubic-bezier(.2,.9,.3,1) backwards}
.q-meta{font-family:var(--font-ui);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);margin-bottom:10px}
.q-prompt{font-size:1.02rem;line-height:1.6}
.q-latex{font-size:1.5rem;margin:14px 0;text-align:center;overflow-x:auto}
.qvisual{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px;margin:12px 0}
.qvisual-cap{font-size:.76rem;color:var(--mut);margin-bottom:8px;text-align:center}
.q-actions{margin-top:10px}
.run-actions{display:flex;justify-content:space-between;margin-top:12px}
/* mc */
.mc{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.mc-opt{display:flex;align-items:center;gap:12px;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;
  padding:14px 16px;color:var(--tx);font-size:1.05rem;cursor:pointer;transition:.18s;min-height:56px;text-align:left}
.mc-opt:hover{border-color:var(--amber);transform:translateX(4px)}
.mc-opt:active{transform:scale(.98)}
.mc-key{width:26px;height:26px;border-radius:8px;background:var(--chart-track);display:flex;align-items:center;
  justify-content:center;font-family:var(--font-mono);font-size:.75rem;color:var(--mut);flex-shrink:0}
/* steps input */
.steps{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.step-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;transition:.2s;flex-wrap:wrap}
.step-lab{flex:1 1 150px;font-size:.86rem;color:var(--tx)}
.step-in{flex:0 1 130px;width:auto}
.step-mark{flex:1 1 auto;min-width:0;justify-content:flex-end}
.step-row.ok{border-color:rgba(85,230,193,.55);background:rgba(85,230,193,.05)}
.step-row.no{border-color:rgba(255,140,140,.55);background:rgba(255,140,140,.05)}
.step-in{background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;color:var(--tx);min-height:44px;
  font-family:var(--font-mono);font-size:16px;padding:9px 10px;text-align:right}
.step-in:focus{outline:2px solid rgba(85,230,193,.5);border-color:var(--amber)}
.step-in:disabled{opacity:.75}

.step-row.ok .step-mark{color:var(--ok)}
.step-row.no .step-mark{color:var(--no)}
.factory-wrap{display:flex;flex-direction:column;gap:6px}
.factory-cv{width:100%;height:auto;border-radius:12px;background:linear-gradient(180deg,rgba(18,22,31,.9),rgba(11,14,19,.9));border:1px solid var(--line)}
/* keypad */
.numin{display:flex;gap:10px;align-items:center;margin-top:14px}
.num-display{flex:1;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;min-height:56px;
  display:flex;align-items:center;padding:0 16px;font-family:var(--font-mono);font-size:1.5rem;letter-spacing:.06em}
.caret::after{content:"|";color:var(--amber);animation:blink 1.1s steps(1) infinite}
.keypad{display:grid;grid-template-columns:repeat(3,72px) 1fr;gap:8px;margin-top:12px;justify-content:center}
.key{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);font-family:var(--font-mono);
  font-size:1.25rem;min-height:56px;cursor:pointer;transition:.12s}
.key:active{background:rgba(85,230,193,.2);transform:scale(.94)}
.key.wide{grid-column:span 2;min-width:120px}
.key.go{background:rgba(85,230,193,.15);border-color:rgba(85,230,193,.4);color:var(--ok)}
@media(max-width:759px){.keypad{grid-template-columns:repeat(3,1fr);max-width:300px;margin:12px auto 0}
 .numin{flex-direction:column;align-items:stretch}.numin .btn{width:100%}}
@media(min-width:760px){
 .q-body .numin{flex-direction:row;align-items:stretch;gap:12px}
 .q-body .numin .num-display{min-height:64px;font-size:1.6rem}
 .q-body .numin .btn{align-self:flex-end}
 .keypad{grid-template-columns:repeat(3,54px);gap:6px;margin:0;max-width:none;justify-content:end;flex-shrink:0}
 .key{min-height:44px;font-size:1rem;border-radius:10px}
 .key.wide{grid-column:span 2;min-width:0}
 .q-body{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
 .q-body .numin,.q-body .keypad{flex:1 1 260px}
}
/* feedback */
.fb{margin-top:14px;border-radius:var(--r2);border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));
  padding:16px;opacity:0;transform:translateY(10px);transition:.35s}
.fb.show{opacity:1;transform:none}
.fb-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.verdict{font-family:var(--font-ui);font-weight:800;font-size:1.1rem;letter-spacing:.04em}
.verdict.ok{color:var(--ok)}.verdict.no{color:var(--no)}
.fb-ans{color:var(--mut);font-size:.9rem}
.koa-line{display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--mut);font-size:.88rem;font-style:italic}
.miss-note{display:flex;gap:8px;background:rgba(255,140,140,.08);border-radius:10px;padding:10px;font-size:.85rem;margin:10px 0}
.solution{margin-top:12px}
.sol-title{display:flex;gap:8px;align-items:center;font-family:var(--font-ui);font-weight:700;color:var(--cyan);margin-bottom:10px}
.sol-step{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.95rem}
.sol-n{width:24px;height:24px;border-radius:8px;background:rgba(126,167,255,.12);color:var(--cyan);display:flex;
  align-items:center;justify-content:center;font-family:var(--font-mono);font-size:.75rem;flex-shrink:0}
.sol-latex{margin-top:6px;font-size:1.1rem;overflow-x:auto}
.sol-final{margin-top:12px;background:rgba(85,230,193,.08);border:1px solid rgba(85,230,193,.3);border-radius:12px;
  padding:12px;text-align:center;font-size:1.2rem;overflow-x:auto}
.takeaway{margin-top:10px;color:var(--mut);font-size:.86rem;font-style:italic}
/* KOA */
.koa{overflow:visible}
.koa-body{transform-origin:60px 60px;animation:koabob 3.4s ease-in-out infinite}
.koa.idle .koa-eye{animation:koablink 5.2s infinite}
.koa.happy .koa-body{animation:koahappy .7s cubic-bezier(.2,1.4,.4,1)}
.koa.oops .koa-body{animation:koaoops .7s ease}
.koa.celebrate .koa-body{animation:koaspin 1s cubic-bezier(.3,1.2,.4,1)}
.koa.focus .koa-gear-l,.koa.focus .koa-gear-r{animation-duration:1.2s}
.koa-gear-l{animation:gearspin 9s linear infinite;transform-origin:0 0}
.koa-gear-r{animation:gearspin 7s linear infinite reverse;transform-origin:0 0}
.koa-antenna{animation:koapulse 2.6s ease-in-out infinite}
.koa-oops .koa-mouth{d:path("M50 64 Q60 60 70 64")}
/* ===== v1.6 SWEEP UI/UX ===== */
/* gap antar panel di layar non-bento (setelan/data) — fix "nempel dempetan" */
.screen>.panel+.panel{margin-top:14px}
.screen>.panel:last-child{margin-bottom:4px}
/* transisi halaman */
.screen{animation:screenin .32s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes screenin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* kv: sisi kanan bisa berisi tombol, rapi & tidak dempet */
.kv{flex-wrap:wrap;gap:6px 10px}
.kv-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
/* onboarding: jarak tombol ↔ catatan ↔ kalibrasi (fix "mepet") */
.ob-form .btn-row{margin:16px 0 12px}
.ob-form .btn-row .btn{margin-bottom:2px}
#calibBox{margin-top:16px}
#calibBox .qcard{animation:qin .3s backwards}
.ob-hero{gap:12px;margin-bottom:22px}
/* modal: tombol tutup */
.modal-x{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--mut);
  font-size:26px;line-height:1;cursor:pointer;padding:6px 10px;border-radius:10px;transition:.2s}
.modal-x:hover{color:var(--tx);background:rgba(148,163,184,.12)}
.modal{position:relative;padding-right:14px}
/* runner header tahan layar sempit */
.run-head{flex-wrap:wrap;gap:8px}
.run-prog{flex:1 1 120px;min-width:90px}
/* fokus keyboard konsisten (mint) */
.btn:focus-visible,.mc-opt:focus-visible,.key:focus-visible,.dd-btn:focus-visible,
.nav-btn:focus-visible,.step-in:focus-visible,.node-chip:focus-visible{outline:2px solid rgba(85,230,193,.7);outline-offset:2px}
/* toggle-row mobile: label & kontrol bisa naik-turun baris dengan rapi */
.toggle-row{flex-wrap:wrap}
.toggle-row>span{flex:1 1 160px}
.dd-inline{min-width:160px}
/* range full-width saat sendirian di baris kecil */
@media(max-width:520px){.toggle-row input[type=range]{width:100%}}
/* scrollbar gelap halus */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,.25);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,.4)}
::-webkit-scrollbar-track{background:transparent}
/* chart token classes (SVG) */
.c-grid{stroke:var(--chart-grid)}
.c-axis{stroke:var(--chart-axis)}
/* heatmap legend */
.hm-legend{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:6px;font-size:.75rem;color:var(--mut)}
.hm-legend .hm-cell{width:9px;height:9px;aspect-ratio:auto}
/* map: pesan kosong pencarian */
.map-empty{padding:14px;color:var(--mut);font-size:.86rem;text-align:center}
/* empty state ringan */
.panel .muted.small:first-child{margin-top:2px}
/* ===== E: landscape pendek — runner 2 kolom, nav menyusut ===== */
@media(orientation:landscape) and (max-height:520px){
  .runner{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,44%);gap:10px 16px;align-items:start}
  .runner .run-head,.runner .combo,.runner .run-actions{grid-column:1/-1}
  .runner .qcard{display:contents}
  .runner .qcard>*{grid-column:1;min-width:0}
  .runner .qcard>.q-body{grid-column:2;grid-row:1/span 8;align-self:start;
    background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:12px}
  .runner #feedback{grid-column:1/-1}
  .runner .q-latex{margin:8px 0}
  .runner .q-body{max-height:calc(100dvh - 84px);overflow:auto}
  .runner .key{min-height:34px;font-size:.95rem}
  .runner .keypad{gap:4px}
  .runner .num-display{min-height:46px;font-size:1.2rem}
  .runner .numin{flex-direction:row;align-items:stretch}
  .runner .numin .btn{min-height:42px}
  .runner .mc-opt{padding:10px 12px}
  .runner .mc-detail{font-size:.7rem}
  .runner .step-in{min-height:38px}
  .runner .step-row{padding:6px 8px;gap:6px;flex-wrap:wrap}
  .runner .step-lab{flex:1 1 110px;font-size:.76rem}
  .runner .step-in{flex:0 1 88px}
  .runner .step-mark{flex:1 1 auto;font-size:.72rem}
  .runner .steps{gap:6px}
  html.route-run nav.bottom{position:absolute;transform:translateY(200%)}
  html.route-run #app{padding-bottom:16px}
}
/* dropdown custom */
.dd{position:relative;min-width:190px}
.dd-inline{min-width:170px}
.dd-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);
  font-family:var(--font-body);font-size:16px;padding:12px 14px;min-height:46px;cursor:pointer;transition:.2s}
.dd-btn:hover{border-color:rgba(85,230,193,.45)}
.dd.open .dd-btn{border-color:var(--amber);box-shadow:0 0 0 3px rgba(85,230,193,.18)}
.dd-chev{transition:transform .25s;color:var(--mut);flex-shrink:0}
.dd.open .dd-chev{transform:rotate(180deg);color:var(--amber)}
.dd-list{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:80;background:var(--panel2);
  border:1px solid var(--line);border-radius:12px;overflow:hidden;
  max-height:0;opacity:0;transform:translateY(-6px);transition:max-height .28s cubic-bezier(.2,.9,.3,1),opacity .2s,transform .28s;pointer-events:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}

<script>
/* Vista Forgy — rng.js
   RNG deterministik (mulberry32 + cyrb128). DILARANG Math.random() di engine. */
(function () {
  'use strict';
  var VF = (window.VF = window.VF || {});

  function cyrb128(str) {
    var h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
    for (var i = 0, k; i < str.length; i++) {
      k = str.charCodeAt(i);
      h1 = h2 ^ Math.imul(h1 ^ k, 597399067);
      h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
      h3 = h4 ^ Math.imul(h3 ^ k, 951274213);
      h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
    }
    h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067);
    h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
    h3 = Math.imul(h1 ^ (h3 >>> 17), 951274213);
    h4 = Math.imul(h2 ^ (h4 >>> 19), 2716044179);
    h1 ^= (h2 ^ h3 ^ h4); h2 ^= h1; h3 ^= h1; h4 ^= h1;
    return [h1 >>> 0, h2 >>> 0, h3 >>> 0, h4 >>> 0];
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function makeRng(seedStr) {
    var s = cyrb128(String(seedStr));
    var f = mulberry32(s[0]);
    var g = mulberry32(s[1]); // stream kedua untuk shuffle independen
    var api = {
      next: f,
      float: function (min, max) { return min + f() * (max - min); },
      int: function (min, max) { return Math.floor(min + f() * (max - min + 1)); },
      bool: function (p) { return f() < (p === undefined ? 0.5 : p); },
      pick: function (arr) { return arr[Math.floor(f() * arr.length)]; },
      pickN: function (arr, n) { return api.shuffle(arr.slice()).slice(0, n); },
      shuffle: function (arr) {
        for (var i = arr.length - 1; i > 0; i--) {
          var j = Math.floor(g() * (i + 1));
          var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
        }
        return arr;
      },
      sign: function () { return f() < 0.5 ? -1 : 1; }
    };
    return api;
  }
  VF.cyrb128 = cyrb128;
  VF.mulberry32 = mulberry32;
  VF.makeRng = makeRng;
})();

<script>

(function () {

  E.registerFamily({

          st(mapCm + ' cm × ' + denom + ' cm = ' + U.fmtID(mapCm * denom, 0) + ' cm; ubah ke meter ÷ 100.')],
        U.fmtID(ans, 1), 'Skala = faktor pengali. Jangan lupa konversi satuan terakhir.')

  /* ============ T1: PECAHAN CAMPUR ============ */
  E.registerFamily({
    familyId: 'fracmix',
    make: function (rng, node, knobs) {

  E.registerFamily({

          { label: '4x^' + e2, latex: '4x^{' + e2 + '}', correct: true },

          st('P(A|C) = ' + U.fmtID(jointA, 4).replace(',', '.') + ' ÷ ' + U.fmtID(total, 4).replace(',', '.') + ' = ' + ans.toFixed(3).replace('.', ',') + '.'),
          st('Cek: hitung juga P(B|C) — keduanya harus berjumlah 1.')],
        ans.toFixed(3).replace('.', ','), 'Bayes = memperbarui keyakinan setelah bukti. QC, medis, spam filter — semua pakai ini.')
      };
    }
  });

  /* ============ T3: CONFIDENCE INTERVAL (z) ============ */
  E.registerFamily({
    familyId: 'ciZ',
    make: function (rng, node, knobs) {
      var n = rng.pick([25, 36, 49, 64, 100]);
      var mean = rng.int(40, 90);
      var sd = rng.pick([6, 8, 10, 12]);
      var conf = rng.pick([['95', 1.96], ['99', 2.575], ['90', 1.645]]);
      var se = sd / Math.sqrt(n);
      var me = conf[1] * se;
      var lo = mean - me, hi = mean + me;
      var askLoHi = rng.bool();
      var ans = askLoHi ? lo : hi;
      return {
        format: 'numeric',
        promptText: 'Sampel ' + n + ' produk: rata-rata ' + mean + ' gram, standar deviasi populasi σ = ' + sd + ' gram. Bangun interval kepercayaan ' + conf[0] + '% (z = ' + conf[1] + '). Berapa batas ' + (askLoHi ? 'BAWAH' : 'ATAS') + ' interval? (2 desimal)',
        promptLatex: '\\bar{x}\\pm z\\frac{\\sigma}{\\sqrt{n}}',
        answer: { value: ans, tol: 0.15 },
        solution: steps('Interval kepercayaan (z)', [
          st('Galat baku = σ/√n = ' + sd + '/√' + n + ' = ' + sd + '/' + Math.sqrt(n) + ' = ' + U.fmtID(se, 4).replace(',', '.') + '.'),
          st('Margin = z × SE = ' + conf[1] + ' × ' + U.fmtID(se, 4).replace(',', '.') + ' = ' + U.fmtID(me, 4).replace(',', '.') + '.'),
          st('Interval: ' + U.fmtID(lo, 2).replace(',', '.') + ' s.d. ' + U.fmtID(hi, 2).replace(',', '.') + '.')],
        U.fmtID(ans, 2), 'CI = estimasi ± margin; 95% berarti prosedur ini menangkap μ sungguhan 95 dari 100 kali.')
      };
    }
  });

  /* ============ T3: DETERMINAN ============ */
  E.registerFamily({
    familyId: 'det',
    make: function (rng, node, knobs) {
      var a = rng.int(-6, 9), b = rng.int(-6, 9), c = rng.int(-6, 9), d = rng.int(-6, 9);
      var det = a * d - b * c;
      return {
        format: 'numeric', promptText: 'Berapa determinan matriks berikut?',
        promptLatex: '\\begin{vmatrix}{' + a + '}&{' + b + '}\\\\{' + c + '}&{' + d + '}\\end{vmatrix}',
        answer: { value: det, tol: 0.01 },
        solution: steps('Determinan 2×2', [
          st('det = ad − bc = (' + a + ')(' + d + ') − (' + b + ')(' + c + ') = ' + (a * d) + ' − ' + (b * c) + '.')],
        String(det), 'ad − bc. Determinan 0 = matriks tak punya invers = kolom saling bergantung.')
      };
    }
  });

  /* ============ T3: INVERS MATRIKS 2×2 ============ */
  E.registerFamily({
    familyId: 'inv2',
    make: function (rng, node, knobs) {
      var a = rng.int(1, 5), d = rng.int(1, 5), b = rng.int(1, 5) * rng.sign(), c = rng.int(1, 5) * rng.sign();
      if (a === d) d = d % 5 + 1; // hindari opsi duplikat
      var det = a * d - b * c;
      if (det === 0 || Math.abs(det) > 12) return null;
      // A = [[a,b],[c,d]]; A^-1 = 1/det [[d,-b],[-c,a]] — tanya elemen (1,1) = d/det dengan bentuk pecahan
      var num = d, den = det;
      if (den < 0) { num = -num; den = -den; }
      var g = U.gcd(Math.abs(num), Math.abs(den));
      num /= g; den /= g;
      var label = den === 1 ? String(num) : num + '/' + den;
      var val = num / den;
      return {
        format: 'mc', promptText: 'Matriks A di bawah. Elemen baris-1 kolom-1 dari A⁻¹ (invers) adalah?',
        promptLatex: 'A=\\begin{pmatrix}{' + a + '}&{' + b + '}\\\\{' + c + '}&{' + d + '}\\end{pmatrix}\\;,\\;A^{-1}=\\frac{1}{ad-bc}\\begin{pmatrix}{d}&{-b}\\\\{-c}&{a}\\end{pmatrix}',
        choices: [
          { label: label, correct: true },
          { label: (den === 1 ? String(a) : a + '/' + den), tag: 'elemen diagonal salah — tukar posisi a dan d' },
          { label: String(1 / det).length > 6 ? U.fmtID(num / den, 2) : String(1 / det), tag: 'lupa bahwa elemennya tetap dibagi determinan' }
        ],
        solution: steps('Invers 2×2', [
          st('det = ' + det + '.'),
          st('Tukar diagonal utama (a↔d), negasikan diagonal lain (−b, −c), bagi semuanya dengan det.'),
          st('Elemen (1,1) = ' + d + '/' + det + ' = ' + label + '.')],
        label, 'Rumus: tukar, negasi, bagi det. Det = 0 → tidak ada invers.')
      };
    }
  });

  /* ============ T4: TEORI ANTREAN M/M/1 (FLAGSHIP + animasi) ============ */
  E.registerFamily({
    familyId: 'mm1',
    make: function (rng, node, knobs) {
      var lam = rng.pick([4, 5, 6, 8, 10, 12]);       // per jam
      var mu = rng.pick([6, 8, 10, 12, 15, 16, 20]);  // per jam
      var rho = lam / mu;
      if (rho < 0.5 || rho > 0.92) return null;
      var Lq = rho * rho / (1 - rho);
      var Ls = rho / (1 - rho);
      var Wq = Lq / lam * 60; // menit
      var Ws = Ls / lam * 60;
      var ask = rng.pick(['rho', 'Lq', 'Wq', 'Ls']);
      var ans, unit, formula;
      if (ask === 'rho') { ans = rho; unit = ''; formula = '\\rho=\\lambda/\\mu'; }
      else if (ask === 'Lq') { ans = Lq; unit = ' orang'; formula = 'L_q=\\frac{\\rho^2}{1-\\rho}'; }
      else if (ask === 'Wq') { ans = Wq; unit = ' menit'; formula = 'W_q=\\frac{L_q}{\\lambda}'; }
      else { ans = Ls; unit = ' orang'; formula = 'L_s=\\frac{\\rho}{1-\\rho}'; }
      if (Math.abs(ans * 10 - Math.round(ans * 10)) > 1e-9) return null;
      var ctx = rng.pick(['loket pembayaran kantin', 'loket layanan bank', 'gerbang gudang logistik', 'customer service toko']);
      var visual = { type: 'queue', caption: 'Animasi antrean: λ = ' + lam + '/jam, μ = ' + mu + '/jam', lam: lam, mu: mu };
      return {
        format: 'numeric',
        promptText: 'Antrean M/M/1 di ' + ctx + ': laju kedatangan (arrival rate) λ = ' + lam + ' pelanggan/jam, laju layanan (service rate) μ = ' + mu + ' pelanggan/jam. Berapa ' +
          (ask === 'rho' ? 'tingkat utilisasi ρ' : ask === 'Lq' ? 'panjang antrean rata-rata Lq' : ask === 'Wq' ? 'waktu tunggu rata-rata Wq' : 'jumlah pelanggan dalam sistem Ls') + (unit ? ' (' + unit.trim() + ', 2 desimal)' : ' (2 desimal)') + '? Rumus disediakan di bawah.',
        promptLatex: formula,
        visual: visual,
        answer: { value: ans, tol: Math.max(0.03, ans * 0.02) },
        solution: steps('Model antrean M/M/1', [
          st('ρ = λ/μ = ' + lam + '/' + mu + ' = ' + U.fmtID(rho, 2).replace(',', '.') + ' (sistem stabil karena ρ < 1).'),
          st('Lq = ρ²/(1−ρ) = ' + U.fmtID(Lq, 2).replace(',', '.') + '; Ls = ρ/(1−ρ) = ' + U.fmtID(Ls, 2).replace(',', '.') + '.'),
          st('Little\u2019s Law: W = L/λ → Wq = ' + U.fmtID(Wq, 1).replace(',', '.') + ' menit, Ws = ' + U.fmtID(Ws, 1).replace(',', '.') + ' menit. (Cek: L = λW ✓)')],
        U.fmtID(ans, 2), 'ρ mendekati 1 → antrean meledak eksponensial. Inilah kenapa kapasitas perlu buffer.')
      };
    }
  });

  /* ============ T4: EOQ (+ grafik interaktif) ============ */
  var EOQ_COMBOS = (function () {
    var out = [];
    [40, 50, 60, 80, 100, 120, 150, 200].forEach(function (q) {
      [20, 24, 30, 45, 50, 60, 75].forEach(function (S) {
        [3, 4, 5, 6, 8, 10, 12].forEach(function (H) {
          var D = H * q * q / (2 * S);
          if (D === Math.round(D) && D >= 600 && D <= 6000 && D % 10 === 0) out.push({ D: D, S: S, H: H, q: q });
        });
      });
    });
    return out;
  })();
  E.registerFamily({
    familyId: 'eoq',
    make: function (rng, node, knobs) {
      if (!EOQ_COMBOS.length) return null;
      var combo = rng.pick(EOQ_COMBOS);
      var D = combo.D, S = combo.S, H = combo.H, q = combo.q;
      var ask = rng.pick(['Q', 'N', 'TC']);
      var n = D / q;
      var tc = D / q * S + q / 2 * H;
      var q2 = 2 * D * S / H; // = q² (untuk pembahasan)
      var ctx = E.context(rng, node.id);
      var ans = ask === 'Q' ? q : ask === 'N' ? n : tc;
      var visual = { type: 'eoq', caption: 'Kurva biaya total persediaan', D: D, S: S, H: H, q: q };
      return {
        format: 'numeric',
        promptText: 'Manajer ' + ctx.place + ' mencatat: permintaan tahunan (demand) D = ' + U.fmtID(D, 0) + ' ' + ctx.unit + ', biaya pemesanan (ordering cost) S = ' + U.fmtID(S, 0) + ' ribu/pesan, biaya simpan (holding cost) H = ' + H + ' ribu/unit/tahun. Berapa ' + (ask === 'Q' ? 'EOQ — jumlah pesan ekonomis Q* (' + ctx.unit + ')' : ask === 'N' ? 'jumlah pemesanan per tahun' : 'total biaya persediaan tahunan (ribu)') + '?',
        promptLatex: 'Q^*=\\sqrt{\\frac{2DS}{H}}',
        visual: visual,
        answer: { value: ans, tol: Math.max(0.5, ans * 0.02) },
        solution: steps('Economic Order Quantity', [
          st('Q* = √(2DS/H) = √(2×' + D + '×' + S + '/' + H + ') = √' + q2 + ' = ' + q + ' ' + ctx.unit + '.'),
          st('Cek titik optimal: biaya pesan = biaya simpan saat Q = Q*. TC = (D/Q*)S + (Q*/2)H = ' + U.fmtID(tc, 1).replace(',', '.') + ' ribu.'),
          st('Frekuensi pesan = D/Q* = ' + U.fmtID(n, 1).replace(',', '.') + '×/tahun.')],
        U.fmtID(ans, 2), 'EOQ = titik di mana biaya pesan dan biaya simpan SEIMBANG — trade-off inti manajemen operasi.')
      };
    }
  });

  /* ============ UNIVERSAL: BREAK-EVEN ============ */
  E.registerFamily({
    familyId: 'breakeven',
    make: function (rng, node, knobs) {
      var FC = rng.pick([12, 18, 24, 30, 40, 60]) * 1000000;
      var p = rng.pick([50, 75, 100, 125, 150, 200]) * 1000;
      var vc = Math.round(p * rng.pick([0.4, 0.5, 0.6, 0.3]));
      var beq = FC / (p - vc);
      if (beq > 8000 || Math.abs(beq - Math.round(beq)) > 1e-9) return null;
      var ask = rng.pick(['BEQ', 'BEP', 'target']);
      var ans, targetTxt;
      if (ask === 'BEQ') { ans = beq; targetTxt = 'Berapa titik impas dalam UNIT (break-even quantity)?'; }
      else if (ask === 'BEP') { ans = beq * p; targetTxt = 'Berapa titik impas dalam RUPIAH (break-even point)?'; }
      else {
        var profit = rng.pick([10, 20, 30]) * 1000000;
        ans = (FC + profit) / (p - vc);
        if (Math.abs(ans - Math.round(ans)) > 1e-9) return null;
        targetTxt = 'Berapa unit yang harus dijual untuk laba ' + U.rupiah(profit) + '?';
      }
      var ctx = E.context(rng, node.id);
      return {
        format: 'numeric',
        promptText: 'Usaha ' + ctx.place + ': biaya tetap (fixed cost) ' + U.rupiah(FC) + ', harga jual ' + U.rupiah(p) + '/unit, biaya variabel (variable cost) ' + U.rupiah(vc) + '/unit. ' + targetTxt,
        promptLatex: 'Q_{BEP}=\\frac{FC}{p-v}',
        answer: { value: ans, tol: Math.max(1, ans * 0.01) },
        solution: steps('Analisis titik impas (break-even)', [
          st('Margin kontribusi per unit = p − v = ' + U.fmtID(p, 0) + ' − ' + U.fmtID(vc, 0) + ' = ' + U.fmtID(p - vc, 0) + '.'),
          st('Q_BEP = FC ÷ margin = ' + U.fmtID(FC, 0) + ' ÷ ' + U.fmtID(p - vc, 0) + ' = ' + U.fmtID(beq, 0) + ' unit.'),
          (ask !== 'BEQ' ? st('Untuk target laba: Q = (FC + target) ÷ margin.') : st('Setelah BEP, setiap unit terjual menambah laba sebesar margin.'))],
        ask === 'BEP' ? U.fmtID(ans, 0) : U.fmtID(ans, 0), 'BEP menjawab "kapan mulai untung?" — bahasa bersama semua jurusan bisnis.')
      };
    }
  });
})();

</script>

<script>
/* Vista Forgy — generators-t3.js (Tier 3 lengkap: kalkulus lanjut, integral, matriks & vektor,
   kombinatorik, peluang bersyarat/binomial/normal, inferensia t/z, regresi) */
(function () {
  'use strict';
  var VF = (window.VF = window.VF || {});
  var E = VF.ENGINE, U = E.util;
  function steps(title, arr, final, takeaway) { return { title: title, steps: arr, final: final, takeaway: takeaway }; }
  function st(text, latex) { return latex ? { text: text, latex: latex } : { text: text }; }
  function fx(v, dec) { return U.fmtID(v, dec === undefined ? 2 : dec); }

  /* ===== T3: RELATED RATES (tangga) ===== */
  E.registerFamily({
    familyId: 'related',
    make: function (rng, node, knobs) {
      var trip = rng.pick([[3, 4, 5], [6, 8, 10], [5, 12, 13], [9, 12, 15]]);
      var L = trip[2], x = trip[0], y = trip[1];
      var v = rng.pick([0.5, 1, 2, 0.4]);
      var ans = -(x / y) * v;
      return {
        format: 'numeric',
        promptText: 'Tangga ' + L + ' m bersandar di dinding. Kaki tangga ditarik menjauh dengan laju ' + fx(v, 1).replace(',0', '') + ' m/detik. Saat kaki tangga ' + x + ' m dari dinding, seberapa cepat UJUNG TANGGA TURUN? (tanda negatif = turun, 3 desimal)',
        promptLatex: 'x^2+y^2=' + L * L,
        answer: { value: ans, tol: 0.02 },
        solution: steps('Laju berhubung (related rates)', [
          st('Pythagoras: x² + y² = ' + L * L + ' → saat x = ' + x + ', y = ' + y + '.'),
          st('Turunkan terhadap waktu t: 2x·(dx/dt) + 2y·(dy/dt) = 0.'),
          st('dy/dt = −(x/y)·(dx/dt) = −(' + x + '/' + y + ')×' + v + ' = ' + ans.toFixed(3).replace('.', ',') + ' m/s.')],
        ans.toFixed(3).replace('.', ',') + ' m/s', 'Related rates: hubungkan variabel (Pythagoras), turunkan terhadap WAKTU, substitusi.')
      };
    }
  });

  /* ===== T3: OPTIMASI TERIKAT (pagar 3 sisi) ===== */
  E.registerFamily({
    familyId: 'optim',
    make: function (rng, node, knobs) {
      var P = 4 * rng.int(6, 20);
      var x = P / 4, y = P / 2, A = x * y;
      var ask = rng.pick(['x', 'y', 'A']);
      var ans = ask === 'x' ? x : ask === 'y' ? y : A;
      return {
        format: 'numeric',
        promptText: 'Sebuah area penyimpanan ' + 'di samping tembok: pagar hanya 3 sisi (2 lebar + 1 panjang, tembok menutup sisi keempat). Total pagar ' + P + ' m. Agar luas maksimum, berapa ' + (ask === 'x' ? 'LEBAR (m)' : ask === 'y' ? 'PANJANG (m)' : 'LUAS MAKSIMUM (m²)') + '?',
        promptLatex: 'A=x\\cdot y\\;,\\;2x+y=' + P,
        answer: { value: ans, tol: 0.01 },
        solution: steps('Optimasi terikat', [
          st('Kendala: 2x + y = ' + P + ' → y = ' + P + ' − 2x.'),
          st('Luas A = x(' + P + ' − 2x) = ' + P + 'x − 2x². Turunan: A′ = ' + P + ' − 4x = 0 → x = ' + x + '.'),
          st('Maka y = ' + y + (ask === 'A' ? ' dan A = ' + x + ' × ' + y + ' = ' + A + '.' : '.'))],
        (ask === 'A' ? A : ans) + (ask === 'A' ? ' m²' : ' m'), 'Optimasi selalu dua langkah: (1) substitusi kendala ke tujuan, (2) turunan = nol.')
      };
    }
  });

  /* ===== T3: LIMIT TRIG ===== */
  E.registerFamily({
    familyId: 'limtrig',
    make: function (rng, node, knobs) {
      var k = rng.int(2, 9);
      var mode = rng.int(0, 1);
      if (mode === 0) {
        return {
          format: 'numeric', promptText: 'Hitung limit (gunakan sin x ≈ x untuk x kecil).',
          promptLatex: '\\lim_{x\\to 0}\\frac{\\sin ' + k + 'x}{x}',
          answer: { value: k, tol: 0.01 },
          solution: steps('Limit trigonometri', [
            st('Bagi pembilang & penyebut: sin(' + k + 'x)/x = k · sin(' + k + 'x)/(' + k + 'x).'),
            st('Saat u → 0, sin(u)/u → 1, jadi hasil = k × 1 = ' + k + '.')],
          String(k), 'sin(kx)/x → k. Trik: samakan "isi" sinus dengan penyebut.')
        };
      }
      var n = rng.int(2, 6);
      return {
        format: 'numeric', promptText: 'Hitung limit.',
        promptLatex: '\\lim_{x\\to 0}\\frac{' + n + 'x}{\\sin x}',
        answer: { value: n, tol: 0.01 },
        solution: steps('Limit trigonometri', [st(n + 'x/sin(x) = ' + n + ' · (x/sin x) = ' + n + ' × 1.')],
        String(n), 'x/sin(x) → 1 — kebalikan dari sin(x)/x.')
      };
    }
  });

  /* ===== T3: INTEGRAL SUBSTITUSI ===== */
  E.registerFamily({
    familyId: 'usub',
    make: function (rng, node, knobs) {
      var a = rng.int(2, 6), n = rng.int(2, 4), b = rng.int(1, 6);
      var cRight = 1 / (a * (n + 1));
      var right = '\\frac{1}{' + (a * (n + 1)) + '}\\left(' + a + 'x+' + b + '\\right)^{' + (n + 1) + '}+C';
      return {
        format: 'mc', promptText: 'Integral tak tentu (substitusi u = ' + a + 'x + ' + b + '):',
        promptLatex: '\\int\\left(' + a + 'x+' + b + '\\right)^{' + n + '}dx',
        choices: [
          { label: '1/' + (a * (n + 1)) + '(' + a + 'x+' + b + ')^' + (n + 1) + '+C', latex: right, correct: true },
          { label: '1/' + (n + 1) + '(' + a + 'x+' + b + ')^' + (n + 1) + '+C', latex: '\\frac{1}{' + (n + 1) + '}\\left(' + a + 'x+' + b + '\\right)^{' + (n + 1) + '}+C', tag: 'lupa membagi turunan bagian dalam (×' + a + ')' },
          { label: '1/' + a + '(' + a + 'x+' + b + ')^' + n + '+C', latex: '\\frac{1}{' + a + '}\\left(' + a + 'x+' + b + '\\right)^{' + n + '}+C', tag: 'pangkat tidak naik' }
        ],
        solution: steps('Substitusi u', [
          st('u = ' + a + 'x + ' + b + ' → du = ' + a + ' dx → dx = du/' + a + '.'),
          st('Integral = (1/' + a + ')∫u^' + n + ' du = (1/' + a + ')·u^' + (n + 1) + '/' + (n + 1) + ' = ' + U.fmtID(cRight, 4).replace(',', '.') + '·u^' + (n + 1) + ' + C.'),
          st('Kembalikan u dan jangan lupa +C.')],
        right, 'Substitusi: cari "dalam", turunannya, lalu bagi. +C wajib.')
      };
    }
  });

  /* ===== T3: RATA-RATA FUNGSI & VOLUME PUTAR ===== */
  E.registerFamily({
    familyId: 'favg',
    make: function (rng, node, knobs) {
      var askVol = rng.bool();
      if (!askVol) {
        var a = rng.int(2, 6), b = rng.int(1, 9), k = rng.int(2, 6);
        var ans = a * k / 2 + b;
        return {
          format: 'numeric', promptText: 'Berapa NILAI RATA-RATA f(x) = ' + a + 'x + ' + b + ' pada interval [0, ' + k + ']?',
          promptLatex: '\\bar{f}=\\frac{1}{' + k + '}\\int_0^{' + k + '}(' + a + 'x+' + b + ')\\,dx',
          answer: { value: ans, tol: 0.05 },
          solution: steps('Nilai rata-rata fungsi', [
            st('Rata-rata = (1/(b−a))∫f dx = (1/' + k + ')[' + a + 'x²/2 + ' + b + 'x] dari 0 sampai ' + k + '.'),
            st('= (1/' + k + ')(' + (a * k * k / 2) + ' + ' + b * k + ') = ' + ans + '.')],
          String(ans), 'Rata-rata fungsi = tinggi persegi panjang yang luasnya sama dengan luas di bawah kurva.')
        };
      }
      var a2 = rng.int(1, 3), k2 = rng.int(2, 3);
      var vol = Math.PI * a2 * a2 * Math.pow(k2, 3) / 3;
      var volRounded = Math.round(vol * 100) / 100;
      return {
        format: 'numeric', promptText: 'Kurva y = ' + (a2 === 1 ? '' : a2) + 'x diputar mengelilingi sumbu-x dari x=0 sampai x=' + k2 + '. Volume benda putar? (gunakan π ≈ 3,14159; 2 desimal)',
        promptLatex: 'V=\\pi\\int_0^{' + k2 + '}\\left(' + a2 + 'x\\right)^2dx',
        answer: { value: volRounded, tol: 0.15 },

  /* ===== helper: graph & algo ===== */
  function graphInstance(rng) {
    var edges = [
      [0, 1], [0, 2], [1, 2], [1, 3], [2, 3], [2, 4], [3, 4]
    ].map(function (e) { return { u: e[0], v: e[1], w: rng.int(2, 12) }; });
    // dijkstra 0->4
    var dist = [0, Infinity, Infinity, Infinity, Infinity], prev = [-1, -1, -1, -1, -1];
    var visited = [false, false, false, false, false];
    for (var it = 0; it < 5; it++) {
      var u = -1;
      for (var i = 0; i < 5; i++) if (!visited[i] && (u === -1 || dist[i] < dist[u])) u = i;
      if (u === -1 || dist[u] === Infinity) break;
      visited[u] = true;
      edges.forEach(function (e) {
        if (e.u === u && dist[u] + e.w < dist[e.v]) { dist[e.v] = dist[u] + e.w; prev[e.v] = u; }
        if (e.v === u && dist[u] + e.w < dist[e.u]) { dist[e.u] = dist[u] + e.w; prev[e.u] = u; }
      });
    }
    var path = [], cur = 4;
    while (cur !== -1) { path.unshift(cur); cur = prev[cur]; }
    // kruskal MST
    var parent = [0, 1, 2, 3, 4];
    function find(x) { while (parent[x] !== x) { parent[x] = parent[parent[x]]; x = parent[x]; } return x; }
    var mst = [], total = 0;
    edges.slice().sort(function (a, b) { return a.w - b.w; }).forEach(function (e) {
      var ru = find(e.u), rv = find(e.v);
      if (ru !== rv) { parent[ru] = rv; mst.push(e); total += e.w; }
    });
    return { edges: edges, dist: dist[4], path: path, mst: mst, mstTotal: total };
  }

    return { type: 'graph', caption: 'Jaringan (bobot = biaya ribu)', pos: pos, edges: g.edges, highlight: highlight || [] };
  }

  /* ===== T4: BRANCH & BOUND (integer programming) ===== */
  E.registerFamily({
    familyId: 'bab',
    make: function (rng, node, knobs) {
      // LP relaksasi punya optimum pecahan; integer optimum berbeda
      for (var tries = 0; tries < 120; tries++) {
        var cons = [];
        for (var i = 0; i < 3; i++) cons.push({ a: rng.int(1, 4), b: rng.int(1, 4), r: rng.int(6, 24) });
        var p1 = rng.int(3, 9), p2 = rng.int(3, 9);
        // fungsional feasibilitas & optimum LP via titik kandidat
        var cand = [[0, 0]];
        cons.forEach(function (c) { cand.push([c.r / c.a, 0]); cand.push([0, c.r / c.b]); });
        for (var pa = 0; pa < cons.length; pa++) for (var pb = pa + 1; pb < cons.length; pb++) {
          var A = cons[pa], B = cons[pb];
          var det = A.a * B.b - B.a * A.b;
          if (det === 0) continue;
          cand.push([(A.r * B.b - B.r * A.b) / det, (A.a * B.r - B.a * A.r) / det]);
        }
        var feas = cand.filter(function (pt) { return pt[0] >= 0 && pt[1] >= 0 && cons.every(function (c) { return c.a * pt[0] + c.b * pt[1] <= c.r + 1e-9; }); });
        var lpBest = -1, lpPt = null;
        feas.forEach(function (pt) { var z = p1 * pt[0] + p2 * pt[1]; if (z > lpBest) { lpBest = z; lpPt = pt; } });
        if (!lpPt) continue;
        if (Math.abs(lpPt[0] - Math.round(lpPt[0])) < 1e-6 && Math.abs(lpPt[1] - Math.round(lpPt[1])) < 1e-6) continue; // harus pecahan
        // integer optimum brute force
        var maxX = Math.floor(Math.max.apply(null, feas.map(function (p) { return p[0]; })));
        var maxY = Math.floor(Math.max.apply(null, feas.map(function (p) { return p[1]; })));
        if (maxX > 8 || maxY > 8) continue;
        var best = -1, bPt = null;
        for (var x = 0; x <= maxX; x++) for (var y = 0; y <= maxY; y++) {
          if (!cons.every(function (c) { return c.a * x + c.b * y <= c.r; })) continue;
          var z2 = p1 * x + p2 * y;
          if (z2 > best) { best = z2; bPt = [x, y]; }
        }
        if (best < 0 || best === Math.floor(lpBest) && Math.abs(lpBest - Math.floor(lpBest)) < 1e-6) continue;

        var ctx = E.context(rng, node.id);

          format: 'numeric',
          promptText: 'Maks Z = ' + p1 + 'x₁ + ' + p2 + 'x₂ dengan kendala ' + cons.map(function (c) { return c.a + 'x₁+' + c.b + 'x₂ ≤ ' + c.r; }).join('; ') + ', x₁, x₂ harus BULAT (integer programming). Solusi relaksasi LP-nya (' + U.fmtID(lpPt[0], 1).replace(',', '.') + ', ' + U.fmtID(lpPt[1], 1).replace(',', '.') + ') — pecahan, tak boleh. Dengan branch & bound, berapa nilai optimal INTEGER?',
          promptLatex: '\\max Z=c_1x_1+c_2x_2\\;,\\;x\\in\\mathbb{Z}^+',
          answer: { value: best, tol: 0.01 },
          solution: steps('Branch & bound', [

      }

    }

            st('a = λ/μ = ' + lam + '/' + mu + ' = ' + a + '; ρ = ' + lam + '/(' + s + '×' + mu + ') = ' + fx(rho, 2) + ' — stabil.'),
            st('p0 = 1/[Σ + ' + Math.pow(a, s) + '/(' + sf + '×' + fx(1 - rho, 2) + ')] = ' + fx(p0, 4) + '.'),
            st('Lq = ' + fx(p0, 4) + ' × ' + Math.pow(a, s) + ' × ' + fx(rho, 2) + '/(' + sf + '×' + fx((1 - rho) * (1 - rho), 3) + ') = ' + fx(Lq2, 2) + ' orang.'),
            st('Wq = ' + fx(Lq2, 2) + '/' + lam + ' jam = ' + fx(Wq2, 1) + ' menit.')
          ], fx(Lq2, 2) + ' orang; Wq = ' + fx(Wq2, 1) + ' menit', 'Rumus Erlang berlaku untuk s server berapapun — yang berubah hanya s! dan pangkat a di p0.')
      };
    }
  });

  /* ===== v1.5.1: SIMPLEKS ITERASI KE-2 (format steps) ===== */
  E.registerFamily({
    familyId: 'simpleks2',
    make: function (rng, node, knobs) {
      for (var tries = 0; tries < 60; tries++) {
        var c1 = rng.int(3, 9), c2 = rng.int(2, 8);
        if (c1 === c2) continue;
        var a11 = rng.int(1, 5), a12 = rng.int(1, 5), a21 = rng.int(1, 5), a22 = rng.int(1, 5);
        var b1 = rng.int(10, 40), b2 = rng.int(10, 40);
        // tableau: Z=[-c1,-c2,0,0|0]; s1=[a11,a12,1,0|b1]; s2=[a21,a22,0,1|b2]
        var T = [
          [-c1, -c2, 0, 0, 0],
          [a11, a12, 1, 0, b1],
          [a21, a22, 0, 1, b2]
        ];
        function pivot(tab, col, row) {
          var p = tab[row][col];
          for (var j = 0; j < 5; j++) tab[row][j] /= p;
          for (var r = 0; r < 3; r++) {
            if (r === row) continue;
            var f = tab[r][col];
            if (f === 0) continue;
            for (var j2 = 0; j2 < 5; j2++) tab[r][j2] -= f * tab[row][j2];
          }
        }
        function enter(tab) {
          var best = -1, bv = 0;
          for (var j = 0; j < 4; j++) if (tab[0][j] < bv - 1e-9) { bv = tab[0][j]; best = j; }
          return best;
        }
        function leave(tab, col) {
          var best = -1, br = Infinity;
          for (var r = 1; r < 3; r++) {
            if (tab[r][col] <= 1e-9) continue;
            var ratio = tab[r][4] / tab[r][col];
            if (ratio < br - 1e-9) { br = ratio; best = r; }
          }
          return best;
        }
        var e1 = enter(T);
        if (e1 < 0) continue;
        var l1 = leave(T, e1);
        if (l1 < 0) continue;
        pivot(T, e1, l1);
        var Z1 = T[0][4];
        var e2 = enter(T);
        if (e2 < 0) continue; // selesai 1 iterasi — tidak dipakai
        var l2 = leave(T, e2);
        if (l2 < 0) continue;
        var theta2 = T[l2][4] / T[l2][e2];
        pivot(T, e2, l2);
        var Z2 = T[0][4];
        if (enter(T) >= 0) continue; // ternyata butuh iterasi ke-3 — skip
        var theta2R = Math.round(theta2 * 100) / 100;
        var Z1R = Math.round(Z1 * 100) / 100, Z2R = Math.round(Z2 * 100) / 100;
        if ([theta2R, Z1R, Z2R].some(function (v) { return Math.abs(v * 100 - Math.round(v * 100)) > 1e-9; })) continue;
        return {
          format: 'steps',
          promptText: 'Maks Z = ' + c1 + 'x₁ + ' + c2 + 'x₂ s.t. ' + a11 + 'x₁+' + a12 + 'x₂ ≤ ' + b1 + '; ' + a21 + 'x₁+' + a22 + 'x₂ ≤ ' + b2 + '. Tableau simpleks ternyata BUTUH DUA ITERASI. Iterasi-1 sudah dilakukan (Z sekarang = ' + fx(Z1R, 2) + '). Kerjakan iterasi KEDUA.',
          promptLatex: '\\text{iterasi 2}: \\theta=\\min\\frac{RHS}{a_{i,enter}}',
          steps: [
            { label: 'variabel ENTERING iterasi-2 (1 = x₁, 2 = x₂)', value: e2 + 1, tol: 0.01 },
            { label: 'rasio θ terkecil iterasi-2 (2 desimal)', value: theta2R, tol: 0.02 },
            { label: 'nilai Z FINAL setelah iterasi-2 (2 desimal)', value: Z2R, tol: 0.05 }
          ],
          answer: { value: Z2R, tol: 0.05 },
          solution: steps('Simpleks iterasi ke-2', [
            st('Setelah iterasi-1 baris Z masih memuat koefisien negatif → belum optimal.'),
            st('Entering iterasi-2: koefisien Z-row paling negatif → x' + (e2 + 1) + ' (jawaban ' + (e2 + 1) + ').'),
            st('Uji rasio pada kolom itu → θ = ' + fx(theta2R, 2) + ' → baris ' + (l2 === 1 ? 's-1' : 's-2') + ' keluar; pivot.'),
            st('Baris Z kini bebas negatif → OPTIMAL: Z* = ' + fx(Z2R, 2) + '.')
          ], 'Z* = ' + fx(Z2R, 2), 'Satu pivot = satu lompatan titik sudut. Selama Z-row masih ada negatif, panjang lagi.')
        };
      }
      return null;
    }
  });
})();
</script>

(function () {

  TB.normCdf = function (z) {
    if (z < 0) return 1 - TB.normCdf(-z);
    var t = 1 / (1 + 0.2316419 * z);
    var poly = t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
    return 1 - TB.normPdf(z) * poly;
  };
  TB.f4 = function (v) { return v.toFixed(4).replace('.', ','); };

  TB.T95 = { 4: 2.132, 5: 2.015, 6: 1.943, 7: 1.895, 8: 1.860, 9: 1.833, 10: 1.812, 12: 1.782, 14: 1.761, 16: 1.746, 18: 1.734, 20: 1.725, 24: 1.711, 29: 1.699, 30: 1.697, 40: 1.684, 60: 1.671, 120: 1.658, 999: 1.645 };
  TB.t975 = function (df) { return TB.T975[df] !== undefined ? TB.T975[df] : (df >= 120 ? 1.98 : TB.T975[999]); };

  /* ---------- Binomial: pmf & cdf eksak ---------- */
  TB.binomCdf = function (n, k, p) {

  TB.binomTableVisual = function (n, k, p) {

  };
})();
